name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download Skia
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
          7z x skia.zip -oskia

      - name: Build Aseprite
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=${{ github.workspace }}\skia -DSKIA_LIBRARY_DIR=${{ github.workspace }}\skia\out\Release-x64 -DSKIA_LIBRARY=${{ github.workspace }}\skia\out\Release-x64\skia.lib -G Ninja ..
          ninja aseprite

      - name: Prepare Package
        run: |
          mkdir dist
          xcopy /E /I build\bin\* dist\
          xcopy /E /I data dist\data\
          where libcrypto-3-x64.dll 2>nul && copy /Y "C:\Program Files\OpenSSL\bin\*.dll" dist\ || echo "No extra OpenSSL"
          where libssl-3-x64.dll 2>nul && copy /Y "C:\Program Files\Git\mingw64\bin\libcrypto*.dll" dist\ || copy /Y "C:\Program Files\Git\mingw64\bin\lib*.dll" dist\

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: dist/
